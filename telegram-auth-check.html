<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проверка Telegram — Что посмотреть?</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0d0f14;color:#f7f8fb;display:grid;place-items:center;padding:24px}
.card{width:min(100%,420px);background:#171a21;border:1px solid #2c313c;border-radius:22px;padding:22px}
h1{font-size:24px;margin:0 0 10px}.muted{color:#9ca5b5;line-height:1.45}.status{margin-top:18px;border-radius:16px;padding:15px;background:#20242d}.ok{color:#61d98c}.error{color:#ff8585}.label{font-size:12px;color:#9ca5b5;margin-top:12px}.value{margin-top:4px;overflow-wrap:anywhere}
@media(prefers-color-scheme:light){body{background:#f2f4f8;color:#171923}.card{background:#fff;border-color:#dfe3ea}.muted,.label{color:#6f7787}.status{background:#f5f6fa}.ok{color:#219a59}.error{color:#d74747}}
</style>
</head>
<body>
<main class="card">
  <h1>Проверка Telegram</h1>
  <div class="muted">Проверяем безопасное подключение пользователя перед переключением личной кинотеки.</div>
  <div id="status" class="status">Проверяем…</div>
</main>
<script>
const statusEl=document.getElementById('status');
const telegram=window.Telegram?.WebApp;
telegram?.ready();
telegram?.expand();

function showError(message){
  statusEl.className='status error';
  statusEl.textContent=message;
}

async function run(){
  const initData=String(telegram?.initData||'');
  if(!initData){
    showError('Telegram initData не получен. Откройте эту страницу именно как Mini App из бота.');
    return;
  }

  try{
    const response=await fetch('/api/telegram-auth',{
      method:'POST',
      headers:{'x-telegram-init-data':initData},
      cache:'no-store'
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok){
      throw new Error(data.error||'Не удалось подтвердить Telegram-сессию.');
    }

    const name=[data.user?.firstName,data.user?.lastName].filter(Boolean).join(' ')||'Telegram-пользователь';
    statusEl.className='status ok';
    statusEl.innerHTML=`<strong>✓ Telegram подключён</strong><div class="label">Пользователь</div><div class="value"></div><div class="label">Внутренний ID</div><div class="value"></div>`;
    const values=statusEl.querySelectorAll('.value');
    values[0].textContent=name;
    values[1].textContent=String(data.userId||'');
  }catch(error){
    showError(error?.message||'Ошибка проверки Telegram.');
  }
}

run();
</script>
</body>
</html>
