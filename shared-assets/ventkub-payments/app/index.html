<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Оплаты">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f7fb">
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png">
  <title>Оплаты</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#f4f7fb; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f4f7fb; }
    #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#6b7280; font-size:16px; background:#f4f7fb; z-index:2; }
  </style>
</head>
<body>
  <div id="loading">Открываем оплаты…</div>
  <iframe id="app" title="Оплаты ВентКуб" src="https://script.google.com/macros/s/AKfycbzoWuSLeDZAajNg13ZBH-R30Zv1LVFehYUaqH9lJBuSMpiFC7jm0k8kSucLiuv9AL04/exec" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => { loading.style.display = 'none'; });
    setTimeout(() => { loading.style.display = 'none'; }, 12000);
  </script>
</body>
</html>
