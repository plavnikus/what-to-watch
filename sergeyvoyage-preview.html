<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Что приготовить сегодня? — SergeyVoyage</title>
<style>
:root{--cream:#F6F3ED;--graph:#2B2B2B;--olive:#6B7A5A;--orange:#FF6A1A;--sand:#E6D9C2;--muted:#74716b;--line:rgba(43,43,43,.10)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--graph);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:680px;min-height:100vh;margin:auto;padding:18px 16px calc(34px + env(safe-area-inset-bottom))}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{font-size:19px;font-weight:850;letter-spacing:-.04em}.logo b{color:var(--orange)}.step{font-size:12px;color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;color:var(--olive);text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(40px,11vw,62px);line-height:.96;letter-spacing:-.06em;margin:14px 0 18px}h2{font-size:32px;line-height:1.03;letter-spacing:-.045em;margin:12px 0}.lead{font-size:18px;line-height:1.42;color:#56534e}.chips,.summary,.meta{display:flex;gap:8px;flex-wrap:wrap}.chip,.summary span,.meta span{font-size:12px;border:1px solid rgba(107,122,90,.16);background:rgba(107,122,90,.09);padding:8px 10px;border-radius:999px}.hero-card{margin:26px 0;background:linear-gradient(145deg,#2B2B2B,#3a3935);border-radius:28px;padding:24px;color:#fff;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(43,43,43,.11)}.hero-card:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-80px;background:rgba(255,106,26,.32)}.dish{font-size:74px;z-index:1}.hero-card p{font-size:17px;line-height:1.4;margin:0;max-width:390px;z-index:1}.btn{width:100%;border:0;border-radius:18px;padding:16px 18px;font-weight:800;font-size:16px}.primary{background:var(--orange);color:#fff;box-shadow:0 10px 24px rgba(255,106,26,.22)}.secondary{background:var(--olive);color:#fff}.ghost{background:transparent;border:1px solid var(--line);color:var(--graph)}.back{border:0;background:transparent;padding:4px 0 14px;color:var(--muted);font-weight:700}.progress{height:5px;background:rgba(43,43,43,.08);border-radius:20px;overflow:hidden;margin-bottom:26px}.progress div{height:100%;background:var(--orange)}.options{display:grid;gap:11px;margin-top:22px}.option{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.68);border-radius:20px;padding:17px 18px;color:var(--graph)}.option strong{display:block;font-size:17px}.option small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.arrow{color:var(--orange);font-size:22px}.cards{display:grid;gap:16px;margin-top:20px}.card{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.78);box-shadow:0 8px 28px rgba(43,43,43,.06)}.visual{height:180px;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,#e7d2b9,#b2ba95);font-size:78px}.visual.meat{background:linear-gradient(145deg,#ddbba7,#815548)}.visual.fish{background:linear-gradient(145deg,#c8dad8,#6d9895)}.visual.veg{background:linear-gradient(145deg,#dce5bf,#8fa266)}.rid{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.8);padding:7px 9px;border-radius:999px;font-size:12px;font-weight:900}.body{padding:18px}.card h3{font-size:23px;line-height:1.08;letter-spacing:-.03em;margin:0 0 14px}.meta{margin-bottom:16px}.meta span{background:var(--cream);border:0}.actions{display:grid;gap:10px;margin-top:18px}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:18px}.recipe-top{background:var(--graph);color:#fff;border-radius:28px;padding:24px;margin-bottom:14px}.recipe-top h1{font-size:36px;margin:12px 0 18px}.section{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:24px;padding:20px;margin:12px 0}.section h3{font-size:22px;margin:0 0 15px}.ingredients{list-style:none;padding:0;margin:0}.ingredients li{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.ingredients li:last-child{border:0}.steps{padding-left:22px;margin:0}.steps li{padding:5px 0 11px;line-height:1.45}.offer{background:var(--olive);color:#fff;border-radius:26px;padding:22px;margin-top:18px}.offer h3{font-size:28px;line-height:1.06;margin:9px 0 12px}.offer p{line-height:1.45;color:#f3f1ea}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--graph);color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;max-width:88%;text-align:center}@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.card:first-child{grid-column:1/-1}}
</style>
</head>
<body><main id="app" class="app"></main>
<script>
const A=document.getElementById('app');let S={step:0,time:30,group:'any',sat:'any'};
const samples={chicken:[['🍗','Та самая курица в липкой медово-чесночной глазури','15 мин','4 порц.'],['🍝','Сливочная паста с курицей, ради которой стоит достать сковороду','25 мин','4 порц.'],['🌶️','Хрустящая курица в сладком чили: сочная внутри, липкая снаружи','25 мин','4 порц.']],meat:[['🥩','Стейк-ужин на одной сковороде: выглядит как из хорошего ресторана','15 мин','2 порц.'],['🌮','Хрустящие тако с сочным мясом и тянущимся сыром','20 мин','4 порц.'],['🍲','Лазанья, которую едят ложкой: густая, сырная и без возни со слоями','40 мин','4 порц.']],fish:[['🍤','Креветки в чесночно-лимонном масле: аромат собирает всех на кухне','10 мин','4 порц.'],['🐟','Нежная белая рыба с соусом, который хочется собрать хлебом','15 мин','4 порц.'],['🍝','Паста с сочными креветками и чесночным маслом','20 мин','4 порц.']],veg:[['🍝','Томатно-сырная паста за 10 минут, когда готовить совсем не хочется','10 мин','4 порц.'],['🍳','Шакшука в пряном томатном соусе: хлеб нужен до последней капли','25 мин','4 порц.'],['🫘','Сливочный нут с вялеными томатами, который хочется собирать хлебом','15 мин','4 порц.']]};
function brand(x=''){return `<header class="brand"><div class="logo">Sergey<b>Voyage</b></div><div class="step">${x}</div></header>`}function home(){S.step=0;A.innerHTML=`${brand()}<div class="eyebrow">● Подбор ужина</div><h1>Что приготовить сегодня?</h1><p class="lead">Три коротких вопроса — и получите три идеи ужина под ваше время и настроение.</p><div class="chips"><span class="chip">36 рецептов</span><span class="chip">без регистрации</span><span class="chip">быстрый выбор</span></div><div class="hero-card"><div class="dish">🍽️</div><p>Не ещё один список рецептов. А быстрый ответ на вопрос, который возникает каждый вечер.</p></div><button class="btn primary" id="start">Подобрать ужин</button>`;document.getElementById('start').onclick=()=>{S.step=1;question()}}
function question(){let title,lead,opts;if(S.step===1){title='Сколько есть времени?';lead='Считаем честное общее время приготовления с нуля.';opts=[['15','До 15 минут','Когда нужно максимально быстро'],['30','До 30 минут','Самый универсальный вариант'],['45','До 45 минут','Можно чуть спокойнее']]}else if(S.step===2){title='Что хочется приготовить?';lead='Выберите продукт или оставьте выбор нам.';opts=[['chicken','Курица',''],['meat','Мясо или фарш',''],['fish','Рыба и морепродукты',''],['veg','Без мяса',''],['any','Неважно','Покажем разные категории']]}else{title='Какой ужин хочется?';lead='Это предпочтение влияет на порядок, но не ограничивает хороший выбор.';opts=[['hearty','Посытнее','Паста, рис, сыр, насыщенные блюда'],['light','Полегче','Больше лёгких вариантов'],['any','Неважно','Не будем ограничивать выбор']]}A.innerHTML=`${brand('Вопрос '+S.step+' из 3')}<button class="back" id="back">← Назад</button><div class="progress"><div style="width:${S.step/3*100}%"></div></div><div class="eyebrow">Быстрый выбор</div><h2>${title}</h2><p class="lead">${lead}</p><div class="options">${opts.map(o=>`<button class="option" data-v="${o[0]}"><span><strong>${o[1]}</strong>${o[2]?`<small>${o[2]}</small>`:''}</span><span class="arrow">→</span></button>`).join('')}</div>`;document.getElementById('back').onclick=()=>{if(S.step===1)home();else{S.step--;question()}};document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(S.step===1)S.time=+v;if(S.step===2)S.group=v;if(S.step===3)S.sat=v;if(S.step<3){S.step++;question()}else results()})}
function setForGroup(){if(S.group==='any')return [samples.chicken[0],samples.fish[0],samples.veg[0]];return samples[S.group]}function cls(e){return e==='🥩'||e==='🌮'||e==='🍲'?'meat':e==='🍤'||e==='🐟'?'fish':e==='🍝'||e==='🍳'||e==='🫘'?'veg':''}function results(){let arr=setForGroup();A.innerHTML=`${brand('Ваши 3 варианта')}<button class="back" id="edit">← Изменить ответы</button><div class="eyebrow">Подобрали под вас</div><h2>Вот что можно приготовить сегодня</h2><div class="summary"><span>до ${S.time} минут</span><span>${S.group==='any'?'разные продукты':({chicken:'курица',meat:'мясо или фарш',fish:'рыба и морепродукты',veg:'без мяса'})[S.group]}</span><span>${S.sat==='hearty'?'посытнее':S.sat==='light'?'полегче':'без ограничений'}</span></div><div class="cards">${arr.map((r,i)=>`<article class="card"><div class="visual ${cls(r[0])}"><span class="rid">0${i+1}</span>${r[0]}</div><div class="body"><h3>${r[1]}</h3><div class="meta"><span>${r[2]}</span><span>${r[3]}</span>${i===0?'<span>одна посуда</span>':''}</div><button class="btn primary open" data-i="${i}">Посмотреть рецепт</button></div></article>`).join('')}</div><div class="actions"><button class="btn secondary" id="again">Хочу другие варианты</button><button class="btn ghost" id="new">Начать заново</button></div><p class="note">Это визуальный прототип. После утверждения дизайна эти карточки будут работать на полной базе из 36 рецептов и с настоящими Food First-фотографиями.</p>`;document.getElementById('edit').onclick=()=>{S.step=1;question()};document.getElementById('new').onclick=home;document.getElementById('again').onclick=()=>toast('В полной версии здесь будет повторный подбор из базы.');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>recipe(arr[+b.dataset.i]))}
function recipe(r){A.innerHTML=`${brand('Рецепт')}<button class="back" id="br">← К трём вариантам</button><div class="recipe-top"><div class="eyebrow" style="color:#E6D9C2">Ваш вариант</div><h1>${r[1]}</h1><div class="meta"><span>${r[2]}</span><span>${r[3]}</span></div></div><section class="section"><h3>Ингредиенты</h3><ul class="ingredients"><li><span>Основной продукт</span><b>500–600 г</b></li><li><span>Овощи / гарнир</span><b>по рецепту</b></li><li><span>Соус и специи</span><b>по вкусу</b></li><li><span>Зелень для подачи</span><b>по желанию</b></li></ul></section><section class="section"><h3>Как приготовить</h3><ol class="steps"><li>Подготовьте ингредиенты и хорошо разогрейте сковороду или духовку.</li><li>Приготовьте основной продукт до румяной поверхности.</li><li>Добавьте соус или гарнир и доведите блюдо до готовности.</li><li>Подавайте сразу — самый аппетитный момент именно сейчас.</li></ol></section><aside class="offer"><div class="eyebrow" style="color:#E6D9C2">Следующий шаг</div><h3>Меньше думать каждый вечер, что приготовить</h3><p>Подборщик решает сегодняшний ужин. «50 быстрых ужинов» даст готовый запас идей на каждый день.</p><button class="btn primary" id="offer">Посмотреть «50 быстрых ужинов»</button></aside><p class="note">Ингредиенты и шаги на этой странице пока демонстрационные. В рабочей версии они будут подставляться из нашей полной базы.</p>`;document.getElementById('br').onclick=results;document.getElementById('offer').onclick=()=>toast('Пока тестируем интерфейс — продажу подключим после утверждения пути.')}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}home();
</script></body></html>
