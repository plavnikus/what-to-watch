name: Daily catalog enrichment

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Movies per batch for this manual run
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '25'
      max_batches:
        description: Maximum batches for this manual run
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '6'

permissions:
  contents: read

concurrency:
  group: daily-catalog-enrichment
  cancel-in-progress: false

env:
  CATALOG_ENRICH_BASE_URL: https://what-to-watch-awy.pages.dev/api/catalog-enrich

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CATALOG_ENRICH_KEY: ${{ secrets.CATALOG_ENRICH_KEY }}
      MANUAL_BATCH_SIZE: ${{ inputs.batch_size || '1' }}
      MANUAL_MAX_BATCHES: ${{ inputs.max_batches || '1' }}

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_ENRICH_KEY:-}" ]; then
            echo "Repository secret CATALOG_ENRICH_KEY is not configured."
            exit 1
          fi

      - name: Enrich catalog safely
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            batch_size=25
            max_batches=6
          else
            batch_size="$MANUAL_BATCH_SIZE"
            max_batches="$MANUAL_MAX_BATCHES"
          fi

          echo "Run mode=${GITHUB_EVENT_NAME} batchSize=${batch_size} maxBatches=${max_batches}"

          total_attempted=0
          total_enriched=0
          total_failed=0
          total_timeouts=0

          for batch_number in $(seq 1 "$max_batches"); do
            echo "Starting enrichment batch ${batch_number}/${max_batches}"

            curl_exit=0
            raw_response="$(curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 120 \
              --request POST \
              --header "x-catalog-enrich-key: ${CATALOG_ENRICH_KEY}" \
              --header "content-type: application/json" \
              --data '{}' \
              --write-out $'\n%{http_code}' \
              "${CATALOG_ENRICH_BASE_URL}?limit=${batch_size}")" || curl_exit=$?

            if [ "$curl_exit" -ne 0 ]; then
              if [ "$curl_exit" -eq 28 ]; then
                total_timeouts=$((total_timeouts + 1))
                echo "Catalog enrichment batch ${batch_number} timed out after 120 seconds. Skipping this batch and continuing safely."
                sleep 5
                continue
              fi

              echo "Catalog enrichment curl request failed with exit code ${curl_exit}."
              exit "$curl_exit"
            fi

            http_status="${raw_response##*$'\n'}"
            body="${raw_response%$'\n'*}"

            if [ "$http_status" != "200" ]; then
              echo "Catalog enrichment endpoint returned HTTP ${http_status}."
              if echo "$body" | jq -e . >/dev/null 2>&1; then
                echo "$body" | jq -c '{error: (.error // .message // "unknown error")}'
              else
                echo "Endpoint returned a non-JSON response (first 2000 chars):"
                printf '%s\n' "$body" | head -c 2000
                echo
              fi
              exit 1
            fi

            requested="$(echo "$body" | jq -r '.requested // 0')"
            attempted="$(echo "$body" | jq -r '.attempted // 0')"
            enriched="$(echo "$body" | jq -r '.enriched // 0')"
            failed="$(echo "$body" | jq -r '.failed // 0')"
            pending_after="$(echo "$body" | jq -r '.pendingAfter // 0')"
            quarantined="$(echo "$body" | jq -r '.quarantined // 0')"
            retry_later="$(echo "$body" | jq -r '.retryLater // 0')"
            stopped="$(echo "$body" | jq -r '.stopped // false')"
            stop_reason="$(echo "$body" | jq -r '.stopReason // ""')"

            total_attempted=$((total_attempted + attempted))
            total_enriched=$((total_enriched + enriched))
            total_failed=$((total_failed + failed))

            echo "requested=${requested} attempted=${attempted} enriched=${enriched} failed=${failed} quarantined=${quarantined} retryLater=${retry_later} pendingAfter=${pending_after} stopped=${stopped}"

            if [ "$stopped" = "true" ]; then
              echo "Provider guard stopped the run: ${stop_reason}"
              break
            fi

            if [ "$requested" -eq 0 ] || [ "$pending_after" -eq 0 ]; then
              echo "Catalog enrichment queue is empty."
              break
            fi

            sleep 2
          done

          {
            echo "### Catalog enrichment"
            echo "- Mode: ${GITHUB_EVENT_NAME}"
            echo "- Batch size: ${batch_size}"
            echo "- Max batches: ${max_batches}"
            echo "- Attempted: ${total_attempted}"
            echo "- Enriched: ${total_enriched}"
            echo "- Failed: ${total_failed}"
            echo "- Transport timeouts: ${total_timeouts}"
          } >> "$GITHUB_STEP_SUMMARY"
