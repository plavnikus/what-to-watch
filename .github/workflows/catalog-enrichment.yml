name: Daily catalog enrichment

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-catalog-enrichment
  cancel-in-progress: false

env:
  CATALOG_ENRICH_URL: https://what-to-watch-awy.pages.dev/api/catalog-enrich?limit=25
  MAX_BATCHES: '6'

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CATALOG_ENRICH_KEY: ${{ secrets.CATALOG_ENRICH_KEY }}

    steps:
      - name: Validate secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_ENRICH_KEY:-}" ]; then
            echo "Repository secret CATALOG_ENRICH_KEY is not configured."
            exit 1
          fi

      - name: Enrich catalog safely
        shell: bash
        run: |
          set -euo pipefail

          total_attempted=0
          total_enriched=0
          total_failed=0

          for batch_number in $(seq 1 "$MAX_BATCHES"); do
            echo "Starting enrichment batch ${batch_number}/${MAX_BATCHES}"

            raw_response="$(curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 120 \
              --request POST \
              --header "x-catalog-enrich-key: ${CATALOG_ENRICH_KEY}" \
              --header "content-type: application/json" \
              --data '{}' \
              --write-out $'\n%{http_code}' \
              "$CATALOG_ENRICH_URL")"

            http_status="${raw_response##*$'\n'}"
            body="${raw_response%$'\n'*}"

            if [ "$http_status" != "200" ]; then
              echo "Catalog enrichment endpoint returned HTTP ${http_status}."
              echo "$body" | jq -c '{error: .error // "unknown error"}' || true
              exit 1
            fi

            requested="$(echo "$body" | jq -r '.requested // 0')"
            attempted="$(echo "$body" | jq -r '.attempted // 0')"
            enriched="$(echo "$body" | jq -r '.enriched // 0')"
            failed="$(echo "$body" | jq -r '.failed // 0')"
            pending_after="$(echo "$body" | jq -r '.pendingAfter // 0')"
            quarantined="$(echo "$body" | jq -r '.quarantined // 0')"
            retry_later="$(echo "$body" | jq -r '.retryLater // 0')"
            stopped="$(echo "$body" | jq -r '.stopped // false')"
            stop_reason="$(echo "$body" | jq -r '.stopReason // ""')"

            total_attempted=$((total_attempted + attempted))
            total_enriched=$((total_enriched + enriched))
            total_failed=$((total_failed + failed))

            echo "requested=${requested} attempted=${attempted} enriched=${enriched} failed=${failed} quarantined=${quarantined} retryLater=${retry_later} pendingAfter=${pending_after} stopped=${stopped}"

            if [ "$stopped" = "true" ]; then
              echo "Provider guard stopped the daily run: ${stop_reason}"
              break
            fi

            if [ "$requested" -eq 0 ] || [ "$pending_after" -eq 0 ]; then
              echo "Catalog enrichment queue is empty."
              break
            fi

            sleep 2
          done

          {
            echo "### Daily catalog enrichment"
            echo "- Attempted: ${total_attempted}"
            echo "- Enriched: ${total_enriched}"
            echo "- Failed: ${total_failed}"
          } >> "$GITHUB_STEP_SUMMARY"
