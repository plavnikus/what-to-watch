<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Что посмотреть?</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f4f8;color:#171923}
.card{width:min(420px,100%);padding:24px;border-radius:24px;background:#fff;border:1px solid #dfe3ea;text-align:center}
.spinner{width:30px;height:30px;margin:0 auto 16px;border:3px solid #dfe3ea;border-top-color:#C4576A;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#6f7787;line-height:1.45}.error{color:#b42318}
@media(prefers-color-scheme:dark){body{background:#0d0f14;color:#f7f8fb}.card{background:#171a21;border-color:#2c313c}p{color:#9ca5b5}}
</style>
</head>
<body>
<main class="card">
  <div id="spinner" class="spinner"></div>
  <h1 id="title">Открываем кинотеку…</h1>
  <p id="message">Безопасно подтверждаем ваш Telegram-аккаунт.</p>
</main>
<script>
(async()=>{
  const tg=window.Telegram?.WebApp;
  const title=document.getElementById('title');
  const message=document.getElementById('message');
  const spinner=document.getElementById('spinner');
  try{
    tg?.ready();
    tg?.expand();
    const initData=String(tg?.initData||'');
    if(!initData)throw new Error('Откройте приложение через Telegram-бота.');

    const response=await fetch('/api/telegram-session',{
      method:'POST',
      headers:{'x-telegram-init-data':initData},
      cache:'no-store',
      credentials:'same-origin'
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok)throw new Error(data.error||'Не удалось подтвердить Telegram.');

    const currentUserId=String(data.userId||'');
    const previousUserId=localStorage.getItem('movieAppTelegramUserIdV1');
    if(previousUserId&&previousUserId!==currentUserId){
      localStorage.removeItem('movieAppImportedMoviesV1');
      localStorage.removeItem('movieAppStatesV1');
      localStorage.removeItem('movieAppPendingLibrarySyncV1');
    }
    localStorage.setItem('movieAppTelegramUserIdV1',currentUserId);
    localStorage.removeItem('movieAppServerLibraryMigratedV1');
    location.replace('/');
  }catch(error){
    spinner.style.display='none';
    title.textContent='Не удалось открыть приложение';
    message.textContent=String(error?.message||error);
    message.classList.add('error');
  }
})();
</script>
</body>
</html>
